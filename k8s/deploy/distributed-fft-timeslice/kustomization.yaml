apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# FFT DRA deployment: the gateway launches one worker pod per FFT model and all
# GPU workloads reference the same DRA ResourceClaim, pinning them to one
# physical GPU allocation. There is no static trainer worker in this variant.
resources:
  - 01-shared-pvc.yaml
  - 02-redis.yaml
  - 03-rbac.yaml
  - 04-gateway.yaml
  - 05-worker-pod-template.yaml
  - 09-sampler-pod-template.yaml
  - 10-dcgm-monitoring.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open-rl-config
    literals:
      - BASE_MODEL="Qwen/Qwen2.5-0.5B"
      - ENABLE_GCP_TRACE="1"
      - OPEN_RL_WEIGHT_SYNC_STRATEGY="delta"
      - OPEN_RL_WEIGHT_SYNC_DELTA_FORMAT="vllm_fused"
      - OPEN_RL_WEIGHT_SYNC_DELTA_APPLY_METHOD="patch_in_place"
      # Image the gateway stamps onto dynamically launched worker pods (the
      # gateway reads it via configMapKeyRef); keep in step with the images
      # override below.
      - OPEN_RL_WORKER_IMAGE="gcr.io/cdrollouts-sunilarora/open-rl-server:0.6.18"

images:
  - name: ghcr.io/gke-labs/open-rl/server
    newName: gcr.io/cdrollouts-sunilarora/open-rl-server
    newTag: 0.6.18
  - name: ghcr.io/gke-labs/open-rl/gateway
    newName: gcr.io/cdrollouts-sunilarora/open-rl-gateway
    newTag: 0.6.18
